# dsh-session-kit bundle layer: sessions management + compact export/import.
#
# Host half:  /session-kit/{info,list,export,import} routes + session_kit agent tool.
# Client half: sidebar row "Session manager" with selection, compact/full export
#              (workspace files on by default), archive import and file restore.
- insert:
    - id: session-kit
      name: dsh-session-kit
      config:
        maxImportBytes: 536870912
        maxExportBytes: 1073741824
        includeAttachments: true
        includeWorkspaceFiles: true
        includeSubagents: false
        restoreWorkspaceFiles: true
        defaultMode: compact
