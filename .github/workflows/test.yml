name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install build tooling
        run: npm ci
      - name: build client bundle
        run: npm run build:client
      - name: code format
        run: npm run format:check
      - name: privacy scan
        run: npm run privacy:check
      - name: committed artifact is up to date
        run: git diff --exit-code -- lib/client.js lib/client.js.map
      - name: unit tests (self-contained)
        run: node --test test/*.test.mjs
      - name: published file list
        run: npm pack --dry-run