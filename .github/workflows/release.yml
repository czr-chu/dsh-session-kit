name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.10.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: package and publish release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci
      - name: verify formatting and build
        run: |
          npm run format:check
          npm run build:client
          git diff --exit-code -- lib/client.js lib/client.js.map
      - name: tests
        run: node --test test/*.test.mjs
      - name: pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing the tarball asset."
            gh release upload "$TAG" dist/*.tgz --clobber
          else
            gh release create "$TAG" dist/*.tgz \
              --title "dsh-session-kit $TAG" \
              --generate-notes \
              --verify-tag
          fi
